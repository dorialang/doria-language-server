[workspace]
members = ["server"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dorialang/doria-language-server"
version = "2026.3.1-canary"

[workspace.dependencies]
doriac = { git = "https://github.com/dorialang/doria", rev = "825fa04db206d0a13d1642bec58c2a186a5f188b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
