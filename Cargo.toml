[workspace]
members = ["server"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dorialang/doria-language-server"
version = "2026.3.1-canary"

[workspace.dependencies]
doriac = { git = "https://github.com/dorialang/doria", rev = "6d33d6d5c8b7b16ff3f0a379bd129aa7c2301d80", default-features = false }
serde_json = "1"

[profile.dev]
panic = "abort"

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
