[workspace]
members = ["server"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dorialang/doria-language-server"
version = "2026.3.1-canary"

[workspace.dependencies]
doriac = { git = "https://github.com/dorialang/doria", rev = "b543e37b7cfd177f802db1f1fedec42323d0bec8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
panic = "abort"

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
