name: release-artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-binaries:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
            artifact: doria-lsp-linux-x86_64
            archive: tar
            filename: doria-lsp-linux-x86_64.tar.gz
            vsix_filename: doria-language-support-linux-x64.vsix
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            artifact: doria-lsp-linux-aarch64
            archive: tar
            filename: doria-lsp-linux-aarch64.tar.gz
            vsix_filename: doria-language-support-linux-arm64.vsix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            vscode_target: darwin-x64
            artifact: doria-lsp-macos-x86_64
            archive: tar
            filename: doria-lsp-macos-x86_64.tar.gz
            vsix_filename: doria-language-support-darwin-x64.vsix
          - os: macos-15
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            artifact: doria-lsp-macos-aarch64
            archive: tar
            filename: doria-lsp-macos-aarch64.tar.gz
            vsix_filename: doria-language-support-darwin-arm64.vsix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            artifact: doria-lsp-windows-x86_64
            archive: zip
            filename: doria-lsp-windows-x86_64.zip
            vsix_filename: doria-language-support-win32-x64.vsix
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vscode_target: win32-arm64
            artifact: doria-lsp-windows-aarch64
            archive: zip
            filename: doria-lsp-windows-aarch64.zip
            vsix_filename: doria-language-support-win32-arm64.vsix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin doria-lsp

      - name: Smoke-test release binary
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/doria-lsp --version

      - name: Smoke-test release binary on Windows
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/doria-lsp.exe --version

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/doria-lsp" "dist/${{ matrix.artifact }}/"
          cp README.md LICENSE "dist/${{ matrix.artifact }}/"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact }}"
          Copy-Item "target/${{ matrix.target }}/release/doria-lsp.exe" "dist/${{ matrix.artifact }}/"
          Copy-Item README.md, LICENSE "dist/${{ matrix.artifact }}/"
          Compress-Archive -Path "dist/${{ matrix.artifact }}/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Bundle Unix language server for VS Code
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p editors/vscode/doria/bin
          cp "target/${{ matrix.target }}/release/doria-lsp" editors/vscode/doria/bin/doria-lsp
          chmod 0755 editors/vscode/doria/bin/doria-lsp

      - name: Bundle Windows language server for VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path editors/vscode/doria/bin
          Copy-Item "target/${{ matrix.target }}/release/doria-lsp.exe" editors/vscode/doria/bin/doria-lsp.exe

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: editors/vscode/doria/.node-version

      - name: Package platform-specific VS Code extension
        working-directory: editors/vscode/doria
        run: |
          npm ci --ignore-scripts
          npm run package -- --target ${{ matrix.vscode_target }} --out ../../../dist/${{ matrix.vsix_filename }}

      - name: Upload server archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

      - name: Upload platform-specific VS Code extension
        uses: actions/upload-artifact@v7
        with:
          name: doria-vscode-${{ matrix.vscode_target }}
          path: dist/${{ matrix.vsix_filename }}
          if-no-files-found: error

  editor-packages:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package IntelliJ plugin
        working-directory: editors/intellij/doria
        run: ./gradlew test buildPlugin --no-daemon

      - name: Upload IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: doria-intellij
          path: editors/intellij/doria/build/distributions/*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-binaries, editor-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Doria Language Server $GITHUB_REF_NAME"
