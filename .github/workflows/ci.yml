name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

  server-platforms:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # The build script starts npm and Gradle differently on each system.
      # The runner's own Node.js is used on purpose: on Windows it lives under
      # a directory whose name has a space.
      - name: Check build script tool launching
        run: php scripts/check_build_tool_launching.php --require-npm

      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update

      # Editor packages are named for the Rust target of the server they
      # carry, which this check reads from the pinned toolchain.
      - name: Check build script platform naming
        run: php scripts/check_build_platform.php

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

  editor-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: editors/vscode/doria/.node-version

      - name: Install VS Code packaging dependencies
        working-directory: editors/vscode/doria
        run: npm ci --ignore-scripts

      # The build platform check asks the pinned toolchain for its host.
      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update

      - name: Check repository guardrails
        run: |
          for script in scripts/check_*.php; do
            php "$script"
          done

      - name: Check developer build entrypoint
        run: |
          php -l scripts/build.php
          php scripts/build.php help

      - name: Check VS Code client syntax
        working-directory: editors/vscode/doria
        run: npm run check

  intellij:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update

      - name: Build and test IntelliJ plugin
        working-directory: editors/intellij/doria
        run: ./gradlew test buildPlugin --no-daemon
